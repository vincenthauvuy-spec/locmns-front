server {
    listen 80;
    server_name _;

    # ─────────────────────────────────────────
    # Sécurité : headers HTTP basiques
    # ─────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # ─────────────────────────────────────────
    # API Spring Boot → proxy vers le backend
    # ─────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts pour les opérations longues (exports, etc.)
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ─────────────────────────────────────────
    # Frontend Angular (SPA)
    # ─────────────────────────────────────────
    location / {
        root       /usr/share/nginx/html;
        index      index.html;

        # Indispensable pour le routing Angular (HTML5 pushState)
        try_files  $uri $uri/ /index.html;
    }

    # Cache des assets Angular (JS/CSS/fonts avec hash dans le nom)
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|webp)$ {
        root    /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}