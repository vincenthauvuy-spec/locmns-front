<!-- Header -->
<div class="mb-6">
  <h1 class="text-2xl font-bold text-base-content">Notifications</h1>
  <p class="text-sm text-base-content/50 mt-1">Vos alertes et informations en cours</p>
</div>

<!-- Chargement -->
<div *ngIf="loading()" class="flex items-center gap-2 text-base-content/60">
  <span class="loading loading-spinner loading-sm"></span> Chargement...
</div>

<!-- Erreur -->
<p *ngIf="erreur()" class="text-sm text-red-500">{{ erreur() }}</p>

<!-- Aucune notification -->
<div *ngIf="!loading() && !erreur() && notifications().length === 0"
  class="rounded-2xl border border-base-300 bg-base-100 px-6 py-12 text-center">
  <p class="text-3xl mb-3">🎉</p>
  <p class="text-base font-semibold text-base-content">Tout est en ordre !</p>
  <p class="text-sm text-base-content/50 mt-1">Vous n'avez aucune notification pour le moment.</p>
</div>

<!-- Liste notifications -->
<div *ngIf="!loading() && !erreur() && notifications().length > 0" class="flex flex-col gap-3">

  <!-- Alertes en premier -->
  <div *ngFor="let n of notifications()" class="rounded-2xl border bg-base-100 px-5 py-4 flex items-start gap-4"
    [style.border-color]="n.type === 'ALERTE' ? '#FECACA' : n.type === 'SUCCES' ? '#BBF7D0' : '#BFDBFE'">

    <!-- Icône -->
    <span class="text-xl flex-shrink-0 mt-0.5">{{ getIcone(n.type) }}</span>

    <!-- Message -->
    <div class="flex-1 min-w-0">
      <p class="text-sm text-base-content">{{ n.message }}</p>
    </div>

    <!-- Badge type -->
    <span
      class="px-2.5 py-0.5 rounded-full text-xs font-semibold flex-shrink-0"
      [style.background]="getBadge(n.type).bg"
      [style.color]="getBadge(n.type).color"
    >
      {{ getBadge(n.type).label }}
    </span>
  </div>

</div>
