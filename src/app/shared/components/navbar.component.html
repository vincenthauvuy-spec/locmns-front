<nav
  class="h-16 flex items-center justify-between px-6"
  style="background: linear-gradient(90deg, #25176e, #2139d1)"
>
  <a routerLink="/dashboard" class="flex items-center gap-3">
    <div
      class="w-8 h-8 rounded-lg flex items-center justify-center"
      style="background-color: rgba(255, 255, 255, 0.15)"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5 text-white"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 10V11"
        />
      </svg>
    </div>
    <span class="text-white font-bold text-lg tracking-tight">LOCMNS</span>
  </a>

  <div class="hidden md:flex items-center gap-1">
    <a
      routerLink="/dashboard"
      routerLinkActive="bg-white/20"
      class="px-4 py-2 rounded-lg text-white/80 hover:text-white hover:bg-white/10 text-sm transition-all"
    >
      Dashboard
    </a>
    <a
      routerLink="/materiels"
      routerLinkActive="bg-white/20"
      class="px-4 py-2 rounded-lg text-white/80 hover:text-white hover:bg-white/10 text-sm transition-all"
    >
      Matériels
    </a>
    <a
      routerLink="/emprunts"
      routerLinkActive="bg-white/20"
      class="px-4 py-2 rounded-lg text-white/80 hover:text-white hover:bg-white/10 text-sm transition-all"
    >
      Emprunts
    </a>
    <a
      routerLink="/incidents"
      routerLinkActive="bg-white/20"
      class="px-4 py-2 rounded-lg text-white/80 hover:text-white hover:bg-white/10 text-sm transition-all"
    >
      Incidents
    </a>
  </div>

  <div class="flex items-center gap-3">
    <div class="text-right hidden sm:block">
      <p class="text-white text-sm font-medium">{{ user()?.email }}</p>
    </div>
    <button
      (click)="toggleTheme()"
      class="px-3 py-2 rounded-lg text-white/80 hover:text-white hover:bg-white/10 transition-all"
    >
      @if (isDark()) {
        ☀
      } @else {
        ☾
      }
    </button>
    <button
      (click)="logout()"
      class="px-3 py-2 rounded-lg text-sm text-white/80 hover:text-white hover:bg-white/10 transition-all"
    >
      Déconnexion
    </button>
  </div>
</nav>
